<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Overlay</title>
<link rel="stylesheet" href="/overlay.css">
<script type="module" src="/js/overlay.js"></script>
</head>
<body>
<div id="canvas">
  <div id="stack">
    <section id="stackGraphic" class="graphic" hidden></section>
    <div id="banner" class="banner" hidden><span id="bannerText"></span></div>
    <section id="bug" aria-label="Live scoreboard" hidden></section>
  </div>
  <section id="lowerGraphic" class="graphic" hidden></section>
  <div id="ticker" hidden><div id="tkLabel" class="tk-label"></div><div id="tkStage" class="tk-stage"></div></div>
  <div id="keyMissing" hidden>Copy the overlay URL from the control panel. It includes the overlay key.</div>
</div>
</body>
</html>
